<div class="app-layout-shell">
  <!-- Desktop Side Rail (>= 900px) -->
  <app-side-rail (openAdd)="openAddTransaction()" />

  <!-- Main Content Container -->
  <main class="main-viewport-content">
    <router-outlet />
  </main>

  <!-- Mobile Bottom Tab Bar (< 900px) -->
  <app-tab-bar (openAdd)="openAddTransaction()" />

  <!-- Global In-App Notification Center -->
  <app-notification-center />

  <!-- Global Add Transaction Sheet -->
  <app-add-edit-transaction-sheet
    [isOpen]="isAddSheetOpen()"
    (dismissed)="isAddSheetOpen.set(false)"
  />

  <!-- Welcome Board / Device Profile Onboarding -->
  @if (userProfile.isWelcomeBoardOpen()) {
    <app-welcome-board />
  }

  <!-- Offline Service Worker Update Prompt -->
  @if (updateAvailable()) {
    <aside class="sw-update-banner" role="status" aria-live="polite">
      <span class="sw-update-text">New version available</span>
      <button type="button" class="sw-reload-btn" (click)="reloadApp()">
        Reload
      </button>
    </aside>
  }
</div>
