<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Loan EMI Tracker</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="description" content="Group Loan Tracker & EMI Ledger with mathematical precision" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="LoanTracker" />
    <meta name="application-name" content="LoanTracker" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="theme-color" content="#f2f3f6" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f2f3f6" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#111216" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon-192.svg" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <script>
      // Disable pinch-to-zoom gestures (iOS Safari, Android Chrome, and trackpads)
      document.addEventListener('gesturestart', function (e) {
        e.preventDefault();
      });
      document.addEventListener('gesturechange', function (e) {
        e.preventDefault();
      });
      document.addEventListener('gestureend', function (e) {
        e.preventDefault();
      });
      document.addEventListener('touchstart', function (e) {
        if (e.touches && e.touches.length > 1) {
          e.preventDefault();
        }
      }, { passive: false });
      document.addEventListener('touchmove', function (e) {
        if (e.touches && e.touches.length > 1) {
          e.preventDefault();
        }
      }, { passive: false });
      document.addEventListener('wheel', function (e) {
        if (e.ctrlKey) {
          e.preventDefault();
        }
      }, { passive: false });
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
