<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Loan EMI Tracker</title>
    <base href="/" />
    <script>
      // Single Page Apps for GitHub Pages SPA redirect decoder
      // MIT License - https://github.com/rafgraph/spa-github-pages
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      })(window.location);
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="description" content="Group Loan Tracker & EMI Ledger with mathematical precision" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="LoanTracker" />
    <meta name="application-name" content="LoanTracker" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="theme-color" content="#f2f3f6" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f2f3f6" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#111216" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="icons/icon-192.svg" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <script>
      // Disable pinch-to-zoom gestures (iOS Safari, Android Chrome, and trackpads)
      document.addEventListener('gesturestart', function (e) {
        e.preventDefault();
      });
      document.addEventListener('gesturechange', function (e) {
        e.preventDefault();
      });
      document.addEventListener('gestureend', function (e) {
        e.preventDefault();
      });
      document.addEventListener('touchstart', function (e) {
        if (e.touches && e.touches.length > 1) {
          e.preventDefault();
        }
      }, { passive: false });
      document.addEventListener('touchmove', function (e) {
        if (e.touches && e.touches.length > 1) {
          e.preventDefault();
        }
      }, { passive: false });
      document.addEventListener('wheel', function (e) {
        if (e.ctrlKey) {
          e.preventDefault();
        }
      }, { passive: false });
    </script>
  </head>
  <body>
    <!-- Native iOS 18+ WebKit Taptic Engine Switch Hook -->
    <input type="checkbox" switch id="haptic-switch" style="position: absolute; opacity: 0; width: 0; height: 0; margin: 0; padding: 0; border: none; top: -100px; left: -100px;" tabindex="-1" aria-hidden="true" />
    <label for="haptic-switch" id="haptic-label" style="display: none;" tabindex="-1" aria-hidden="true"></label>
    <app-root></app-root>
  </body>
</html>
