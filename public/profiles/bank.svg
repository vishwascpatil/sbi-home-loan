<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="bankBg" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="60%" stop-color="#047857" />
      <stop offset="100%" stop-color="#064e3b" />
    </radialGradient>
    <linearGradient id="roofGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#d1fae5" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#059669" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Circular Background -->
  <circle cx="60" cy="60" r="58" fill="url(#bankBg)" />

  <!-- Inner Subtle Accent Ring -->
  <circle cx="60" cy="60" r="54" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2" />

  <!-- Bank / Temple Icon Group -->
  <g filter="url(#softGlow)" fill="url(#roofGrad)">
    <!-- Pediment / Roof Triangle -->
    <polygon points="60,26 28,44 92,44" />
    
    <!-- Architrave Beam -->
    <rect x="28" y="46" width="64" height="5" rx="1.5" />

    <!-- 4 Classical Pillars -->
    <rect x="33" y="53" width="7" height="26" rx="2" />
    <rect x="47" y="53" width="7" height="26" rx="2" />
    <rect x="66" y="53" width="7" height="26" rx="2" />
    <rect x="80" y="53" width="7" height="26" rx="2" />

    <!-- Podium / Base Steps -->
    <rect x="26" y="81" width="68" height="6" rx="2" />
    <rect x="22" y="88" width="76" height="6" rx="2" />

    <!-- Center Shield Emblem with Rupee / Check -->
    <circle cx="60" cy="65" r="7" fill="#047857" />
    <path d="M57 65 L59.5 67.5 L63.5 62.5" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>

